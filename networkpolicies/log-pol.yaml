apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-processor-netpol
  namespace: microservices
spec:
  podSelector:
    matchLabels:
      app: log-processor
  policyTypes:
  - Ingress
  - Egress
  ingress: []  # No permite tráfico entrante (es un worker que consume de Redis)
  egress:
  # Permite DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Permite salida a redis para consumir mensajes
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
