apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-api-config
  namespace: microservices
  labels:
    app: auth-api
    component: backend
    tier: authentication
data:
  # Puerto del servicio
  AUTH_API_PORT: "8081"
  
  # URL del servicio de usuarios interno
  USERS_API_ADDRESS: "http://users-api:8083"
  
  # URL de Zipkin para distributed tracing
  ZIPKIN_URL: "http://zipkin:9411/api/v2/spans"
  
  # Nombre del servicio para tracing
  SERVICE_NAME: "auth-api"
  
  # Usuarios permitidos (formato: username_password)
  # Estos son hashes simples para demo - en producción usar bcrypt
  ALLOWED_USER_HASHES: "admin_admin,johnd_foo,janed_ddd"
