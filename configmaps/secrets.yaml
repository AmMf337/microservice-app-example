apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: microservices
  labels:
    app: microservices
    component: security
    tier: shared
type: Opaque
stringData:
  # JWT Secret usado por todos los servicios
  # IMPORTANTE: Cambiar en producción por un secret fuerte y único
  # Debe coincidir en auth-api, todos-api y users-api
  JWT_SECRET: "myfancysecret"

---
# Ejemplo de cómo generar un JWT secret seguro
# kubectl create secret generic jwt-secret \
#   --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
#   -n microservices

apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret-prod
  namespace: default
  labels:
    app: microservices
    component: security
    tier: shared
    environment: production
type: Opaque
data:
  # Para producción, generar un secret aleatorio y codificarlo en base64
  # echo -n "tu-secret-super-seguro-generado-aleatoriamente" | base64
  # Este es solo un ejemplo - GENERAR UNO NUEVO para producción
  JWT_SECRET: dHUtc2VjcmV0LXN1cGVyLXNlZ3Vyby1nZW5lcmFkby1hbGVhdG9yaWFtZW50ZQ==
