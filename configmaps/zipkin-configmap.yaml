apiVersion: v1
kind: ConfigMap
metadata:
  name: zipkin-config
  namespace: microservices
  labels:
    app: zipkin
    component: tracing
    tier: infrastructure
data:
  apiVersion: v1
kind: ConfigMap
metadata:
  name: zipkin-config
  namespace: microservices
  labels:
    app: zipkin
    component: tracing
    tier: infrastructure
data:
  # Puerto HTTP
  SERVER_PORT: "9411"

  STORAGE_TYPE: "mem"

  # Configuración de memoria Java
  JAVA_OPTS: "-Xms256m -Xmx512m"

  # Sampling rate (1.0 = 100% de las trazas)
  SAMPLE_RATE: "1.0"

  # Límite del tamaño del buffer en memoria
  MAX_SPANS: "500000"

  # Nivel de logs
  LOG_LEVEL: "INFO"
---
