apiVersion: v1
kind: ConfigMap
metadata:
  name: zipkin-config
  namespace: microservices
  labels:
    app: zipkin
    component: tracing
    tier: infrastructure
data:
  # Puerto en el que Zipkin escucha peticiones HTTP
  SERVER_PORT: "9411"

  # Tipo de almacenamiento
  STORAGE_TYPE: "redis"

  # Configuración de Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Sampling rate
  SAMPLE_RATE: "1.0"

  # Límite del tamaño del buffer en memoria (en spans)
  MAX_SPANS: "500000"

  # Nivel de logs
  LOG_LEVEL: "INFO"

