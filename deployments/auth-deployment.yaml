# Deployment para Auth API (Go)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: microservices
  labels:
    app: auth-api
    component: backend
    tier: authentication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
        component: backend
        tier: authentication
    spec:
      serviceAccountName: microservices-sa
      containers:
      - name: auth-api
        image: auth-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: auth-api-config
        
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        
---
# Service para Auth API
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: microservices
  labels:
    app: auth-api
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: auth-api
