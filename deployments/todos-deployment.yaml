---
# Deployment para Todos API (Node.js/Express)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-api
  namespace: microservices
  labels:
    app: todos-api
    component: backend
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todos-api
  template:
    metadata:
      labels:
        app: todos-api
        component: backend
        tier: application
    spec:
      serviceAccountName: microservices-sa
      containers:
      - name: todos-api
        image: todos-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Variables de entorno desde ConfigMap
        envFrom:
        - configMapRef:
            name: todos-api-config
        
        # JWT Secret desde Secret
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        

---
# Service para Todos API
apiVersion: v1
kind: Service
metadata:
  name: todos-api
  namespace: microservices
  labels:
    app: todos-api
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: todos-api
